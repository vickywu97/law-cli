[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "law-cli"
version = "1.0.0"
description = "中文地方性法规/法律的法条速查器：合法获取、固定来源、可复现证明的最小闭环（AI 审核终核）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Vicky Wu", email = "vickywu97@163.com" }
]
keywords = ["legal", "chinese-law", "cli", "regulation", "compliance", "law"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/vickywu97/law-cli"
Repository = "https://github.com/vickywu97/law-cli"
Documentation = "https://github.com/vickywu97/law-cli/blob/main/docs/index.md"
LinkedIn = "https://www.linkedin.com/in/wuyitong"

[project.scripts]
law-cli = "law_cli:main"

[tool.setuptools]
py-modules = ["law_cli"]
