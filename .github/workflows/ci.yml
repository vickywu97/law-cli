name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests (zero dependencies, stdlib only)
        run: python3 tests/test_law_cli.py
      - name: Verify gate (AI 审核即终核 — 仅 pending 拦截)
        run: python3 law_cli.py verify --gate
